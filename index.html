<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TaskFlow is a simple, fast task manager that saves your tasks in your browser.">
  <title>TaskFlow – Task Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4bdb'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="logo" href="./" aria-label="TaskFlow home">
        <svg class="logo__mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="logo__text">TaskFlow</span>
      </a>

      <section class="progress" aria-label="Overall progress">
        <div class="progress__ring" id="progress-ring" role="img" aria-label="0 percent complete">
          <span class="progress__value" id="progress-value">0%</span>
        </div>
        <p class="progress__label" id="progress-label">Add a task to get started</p>
      </section>

      <p class="sidebar__note">Your tasks are saved in this browser. Nothing is sent anywhere.</p>
    </aside>

    <main class="main">
      <header class="page-header">
        <h1>Today's tasks</h1>
        <p>Capture what needs doing, then check it off.</p>
      </header>

      <section class="stats" aria-label="Task summary">
        <div class="stat"><span class="stat__label">Total</span><strong class="stat__value" id="stat-total">0</strong></div>
        <div class="stat"><span class="stat__label">Pending</span><strong class="stat__value" id="stat-pending">0</strong></div>
        <div class="stat"><span class="stat__label">Completed</span><strong class="stat__value stat__value--done" id="stat-completed">0</strong></div>
      </section>

      <form class="task-form" id="task-form" novalidate>
        <label class="visually-hidden" for="task-input">New task</label>
        <input class="task-form__input" id="task-input" type="text" maxlength="120" autocomplete="off" placeholder="What needs to be done?" aria-describedby="form-error">
        <button class="btn btn--primary" type="submit">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          Add task
        </button>
        <p class="task-form__error" id="form-error" role="alert" hidden></p>
      </form>

      <section class="tasks" aria-labelledby="tasks-heading">
        <div class="tasks__toolbar">
          <h2 id="tasks-heading" class="visually-hidden">Task list</h2>
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <button class="btn btn--ghost" type="button" id="clear-completed">Clear completed</button>
        </div>

        <ul class="task-list" id="task-list"></ul>

        <div class="empty" id="empty-state" hidden>
          <svg class="empty__icon" viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="8" width="40" height="48" rx="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 24h20M22 34h20M22 44h11" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          <h3 class="empty__title" id="empty-title"></h3>
          <p class="empty__text" id="empty-text"></p>
        </div>
      </section>

      <p class="notice" id="storage-notice" role="status" hidden></p>
      <footer class="footer">TaskFlow · Built with HTML, CSS and vanilla JavaScript</footer>
    </main>
  </div>

  <dialog class="dialog" id="confirm-dialog" aria-labelledby="dialog-title">
    <form method="dialog">
      <h2 id="dialog-title">Clear completed tasks?</h2>
      <p id="dialog-text"></p>
      <div class="dialog__actions">
        <button class="btn btn--ghost" value="cancel">Cancel</button>
        <button class="btn btn--danger" value="confirm" id="confirm-clear">Clear tasks</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
